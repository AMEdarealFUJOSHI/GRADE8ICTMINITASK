
<!DOCTYPE html>
<html>
<head>
<title>Heartly Yours ♡</title>

<style>
body {
  background: #f5dce8;
  font-family: "Comic Sans MS", cursive;
  padding: 30px;
  color: #594653;
}

.notebook {
  max-width: 650px;
  margin: auto;
  padding: 25px;
  background: #fffdfd;
  border: 2px solid #e8b7ce;
  box-shadow: 5px 5px 0 #d9a5bd;
}

h1 {
  text-align: center;
  color: #d77da5;
  font-size: 28px;
}

input, textarea {
  box-sizing: border-box;
  width: 100%;
  border: none;
  outline: none;
  background: transparent;
  color: #594653;
  font-family: "Comic Sans MS", cursive;
  font-size: 16px;
}

input {
  border-bottom: 1px dashed #dda5bd;
  padding: 10px;
  margin-bottom: 15px;
}

textarea {
  height: 420px;
  resize: vertical;
  line-height: 30px;
  padding: 5px 10px;
  background-image: repeating-linear-gradient(
    transparent,
    transparent 29px,
    #f3dce6 30px
  );
}
</style>
</head>

<body>
<div class="notebook">
  <h1>♡ Heartly Yours ♡</h1>

  <input type="text" placeholder="poem title...">

  <textarea placeholder="the words of my heart go here..."></textarea>
</div>
</body>
</html>
